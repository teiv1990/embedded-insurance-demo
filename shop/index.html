<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Shop Demo · Embedded Insurance Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../shared/apps.css">
</head>
<body>
  <div class="stage">
    <main class="device-area">
      <div class="device-wrap" id="deviceWrap">
        <div class="phone" id="phone">
          <div class="phone-btn b1"></div><div class="phone-btn b2"></div><div class="phone-btn b3"></div><div class="phone-btn b4"></div>
          <div class="screen" id="screen">
            <div class="island"></div>
            <div class="statusbar">
              <span id="clock">9:41</span>
              <span class="sb-icons">
                <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                <span class="batt"><span></span></span>
              </span>
            </div>
            <div class="app" id="app"></div>
            <div class="sheet-backdrop" id="sheetBackdrop"></div>
            <div class="sheet" id="sheet"></div>
            <div class="toast" id="toast"></div>
            <div class="home-ind"></div>
          </div>
        </div>
      </div>
      <div class="demo-note">BẢN DEMO minh họa – "Shop Demo" không phải sàn thương mại điện tử thật</div>
    </main>
  </div>
  <script src="../shared/engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
